site_name: FP Mojo
site_description: Functional programming for Mojo — tutorials, architecture, API reference and examples.
site_url: https://spellbound-mojo.github.io/fp_mojo/
repo_url: https://github.com/Spellbound-Mojo/fp_mojo
docs_dir: docs/content
site_dir: .cache/docs-site
use_directory_urls: true
strict: true
theme:
  name: null
  custom_dir: docs/theme
  static_templates: [404.html]
plugins:
  - search:
      lang: en
      min_search_length: 2
hooks:
  - docs/hooks.py
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - fenced_code
  - tables
  - toc:
      permalink: true
  - codehilite:
      guess_lang: false
not_in_nav: |
  /search.md
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
watch:
  - src/fp
  - docs/examples
  - docs/examples.json
  - docs/public-exports.json
  - docs/api.json
nav:
  - Welcome: index.md
  - Get started:
      - Installation: start/installation.md
      - Choose an API: start/choosing-api.md
      - Ownership and errors: start/ownership.md
  - Tutorial:
      - 1. Eager pipelines: tutorial/pipelines.md
      - 2. Folds and lazy iteration: tutorial/iteration.md
      - 3. Results and recovery: tutorial/results.md
      - 4. Algebraic data and pattern matching: tutorial/matching.md
      - 5. Algebraic data types stored in place: tutorial/choices.md
      - 6. Inductive data types: tutorial/recursion.md
      - 7. A configuration processor: tutorial/application.md
      - 8. Functors, applicatives and monads: tutorial/algebra.md
      - 9. Reader, State and Writer: tutorial/effects.md
  - Examples:
      - Example gallery: examples/index.md
  - Architecture:
      - Overview: architecture/overview.md
      - Design principles: architecture/principles.md
      - Callables and invocation: architecture/callables.md
      - Functions and partial application: architecture/functions.md
      - Iteration: architecture/iteration.md
      - Result, Optional and ControlFlow: architecture/data.md
      - Algebraic data and matching: architecture/matching.md
      - Algebra and effects: architecture/algebra.md
      - Laws: architecture/laws.md
      - Performance and targets: architecture/performance.md
      - Native Mojo boundaries: architecture/native-boundaries.md
      - Explicit async state machines: architecture/async-state-machines.md
      - Async composition: architecture/async-composition.md
      - Async callback registration: architecture/async-callbacks.md
      - Dynamic async nurseries: architecture/async-nurseries.md
      - Wake-driven async execution: architecture/async-scheduler.md
      - Resumable async coordination: architecture/async-coordination.md
      - Structured races and timeouts: architecture/async-racing.md
      - Async integration workload: architecture/async-workload.md
      - Async overnight qualification: architecture/async-qualification.md
      - Async finalization and masking: architecture/async-finalization.md
      - Verification: architecture/verification.md
  - API reference:
      - How to read the reference: reference/index.md
      - fp.callables: reference/callables.md
      - fp.combinators: reference/combinators.md
      - fp.functions: reference/functions.md
      - fp.iteration: reference/iteration.md
      - fp.control: reference/control-flow.md
      - fp.adt: reference/adt.md
      - fp.data: reference/data.md
      - fp.algebra: reference/algebra.md
      - fp.effects: reference/effects.md
      - fp.effects.async_runtime: reference/effects.async_runtime.md
      - fp.effects.async_runtime.protocols: reference/effects.async_runtime.protocols.md
      - fp.matching: reference/matching.md
  - Guides:
      - Async runtime preview: guides/async-runtime.md
      - Support and limitations: guides/status.md
      - Mojo 1.2 compatibility: guides/compatibility.md
      - Generic wrappers: guides/generic-wrappers.md
      - Troubleshooting: guides/troubleshooting.md
  - Contributing:
      - Development: contributing/development.md
      - Benchmarks: contributing/benchmarks.md
      - Maintaining the docs: contributing/documentation.md
